<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow"
     data-horizontal="false"
     data-forcescrollbar="true"
     data-centerfocus="true"
     data-controller="__plugin/WatchTogether.js"
     data-require="emby-input,emby-select,emby-button">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page settingsContainer">
        <h1>Watch Together</h1>
        <p class="sectionDescription" id="wtStatus">加载中…</p>

        <div class="verticalSection" style="margin-bottom:2em;">
            <h2>创建房间</h2>
            <div class="inputContainer">
                <input is="emby-input" id="wtRoomName" label="房间名称" placeholder="例如：今晚的电影" />
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:1em; align-items:flex-end;">
                <div class="selectContainer">
                    <select is="emby-select" id="wtUserA" label="参与者 A"></select>
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="wtUserB" label="参与者 B"></select>
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="wtPrimary" label="主用户"></select>
                </div>
                <button is="emby-button" id="wtCreate" type="button" class="raised">创建房间</button>
            </div>
        </div>

        <div class="verticalSection">
            <h2>房间列表</h2>
            <div id="wtRooms" class="sectionDescription"></div>
        </div>
    </div>
</div>
